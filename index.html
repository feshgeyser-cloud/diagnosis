<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CarePath helps organize symptoms and lab findings before a conversation with a licensed clinician."
    />
    <title>CarePath — Make sense of the in-between</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: 176 38% 96%;
        --foreground: 201 35% 19%;
        --border: 175 22% 84%;
        --card: 173 31% 98%;
        --card-border: 174 23% 85%;
        --primary: 176 35% 29%;
        --primary-foreground: 173 31% 98%;
        --secondary: 166 46% 88%;
        --muted: 174 24% 91%;
        --muted-foreground: 200 18% 46%;
        --accent: 23 86% 77%;
        --accent-foreground: 20 43% 23%;
        --destructive: 5 65% 47%;
        --input: 174 23% 79%;
        --font-sans: "DM Sans", sans-serif;
        --font-serif: "Fraunces", Georgia, serif;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        min-width: 320px;
        margin: 0;
        color: hsl(var(--foreground));
        background:
          radial-gradient(circle at 8% 2%, hsl(166 46% 88% / 0.75), transparent 27rem),
          radial-gradient(circle at 95% 28%, hsl(23 86% 77% / 0.26), transparent 23rem),
          hsl(var(--background));
        font-family: var(--font-sans);
      }

      button, input { font: inherit; }
      button:focus-visible, input:focus-visible, a:focus-visible {
        outline: 3px solid hsl(var(--accent));
        outline-offset: 3px;
      }
      a { color: inherit; }
      .cp-shell { min-height: 100vh; overflow: hidden; }
      .cp-nav, .cp-wrap {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
      }
      .cp-nav {
        padding: 25px 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .cp-brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: hsl(var(--foreground));
        text-decoration: none;
        letter-spacing: -0.03em;
        font-size: 1.1rem;
        font-weight: 700;
      }
      .cp-brand-mark {
        width: 33px;
        height: 33px;
        display: grid;
        place-items: center;
        color: hsl(var(--primary-foreground));
        background: hsl(var(--primary));
        border-radius: 11px 11px 11px 4px;
        box-shadow: 0 6px 14px hsl(var(--primary) / 0.2);
      }
      .cp-nav-actions, .cp-nav-meta {
        display: inline-flex;
        align-items: center;
      }
      .cp-nav-actions { gap: 20px; }
      .cp-nav-meta {
        gap: 9px;
        color: hsl(var(--muted-foreground));
        font-size: 0.76rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .cp-trust-dot {
        width: 7px;
        height: 7px;
        background: hsl(145 35% 50%);
        border-radius: 99px;
        box-shadow: 0 0 0 4px hsl(145 35% 50% / 0.13);
      }
      .cp-contact-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid hsl(var(--primary) / 0.24);
        border-radius: 999px;
        padding: 9px 14px;
        color: hsl(var(--primary));
        background: hsl(var(--card) / 0.68);
        box-shadow: 0 5px 14px hsl(var(--primary) / 0.08);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-decoration: none;
        transition: transform 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
      }
      .cp-contact-link:hover {
        background: hsl(var(--primary) / 0.08);
        box-shadow: 0 8px 18px hsl(var(--primary) / 0.14);
        transform: translateY(-1px);
      }
      .cp-kicker {
        margin: 0;
        color: hsl(var(--primary));
        font-size: 0.7rem;
        line-height: 1.4;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .cp-serif {
        font-family: var(--font-serif);
        letter-spacing: -0.045em;
      }
      .cp-hero {
        padding: 62px 0 84px;
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(400px, 1.08fr);
        gap: clamp(48px, 8vw, 112px);
        align-items: center;
      }
      .cp-hero h1 {
        max-width: 580px;
        margin: 17px 0 21px;
        font-size: clamp(3.15rem, 6.1vw, 5.5rem);
        line-height: 0.95;
      }
      .cp-hero h1 em { color: hsl(var(--primary)); font-style: normal; }
      .cp-hero-copy {
        max-width: 475px;
        margin: 0;
        color: hsl(var(--muted-foreground));
        font-size: 1.06rem;
        line-height: 1.75;
      }
      .cp-proof-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 31px;
        color: hsl(var(--muted-foreground));
        font-size: 0.78rem;
      }
      .cp-proof-line { width: 32px; height: 1px; background: hsl(var(--border)); }
      .cp-intake-card {
        position: relative;
        border: 1px solid hsl(var(--card-border));
        border-radius: 25px;
        padding: 23px;
        background: hsl(var(--card) / 0.91);
        box-shadow: 0 12px 30px hsl(var(--foreground) / 0.07);
        animation: cp-rise 700ms both cubic-bezier(.22,1,.36,1);
      }
      .cp-intake-card::before {
        content: "";
        position: absolute;
        top: -12px;
        right: 31px;
        width: 82px;
        height: 24px;
        border: 1px solid hsl(var(--accent) / 0.62);
        border-radius: 5px;
        background: hsl(var(--accent) / 0.32);
        transform: rotate(3deg);
      }
      .cp-card-top, .cp-section-heading, .cp-clinician, .cp-footer {
        display: flex;
        justify-content: space-between;
      }
      .cp-card-top {
        align-items: center;
        padding: 2px 1px 19px;
      }
      .cp-card-title {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 0.84rem;
        font-weight: 700;
      }
      .cp-card-title-icon { color: hsl(var(--primary)); }
      .cp-step-count {
        color: hsl(var(--muted-foreground));
        font-size: 0.72rem;
        font-weight: 600;
      }
      .cp-progress {
        height: 5px;
        margin-bottom: 22px;
        overflow: hidden;
        border-radius: 10px;
        background: hsl(var(--muted));
      }
      .cp-progress > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: hsl(var(--primary));
        transition: width 450ms cubic-bezier(.22,1,.36,1);
      }
      .cp-chat { display: grid; gap: 14px; min-height: 305px; }
      .cp-bubble {
        width: fit-content;
        max-width: 88%;
        padding: 13px 15px;
        color: hsl(var(--foreground));
        font-size: 0.87rem;
        line-height: 1.52;
        border-radius: 5px 17px 17px 17px;
        background: hsl(var(--secondary));
        animation: cp-fade 430ms both;
      }
      .cp-bubble.user {
        justify-self: end;
        border-radius: 17px 5px 17px 17px;
        color: hsl(var(--primary-foreground));
        background: hsl(var(--primary));
      }
      .cp-bubble small {
        display: block;
        margin-bottom: 5px;
        color: hsl(var(--primary) / 0.72);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .cp-bubble.user small { color: hsl(var(--primary-foreground) / 0.65); }
      .cp-options { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 2px; }
      .cp-option {
        border: 1px solid hsl(var(--border));
        border-radius: 99px;
        padding: 8px 12px;
        cursor: pointer;
        color: hsl(var(--foreground));
        background: hsl(var(--card));
        font-size: 0.76rem;
        transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
      }
      .cp-option:hover {
        border-color: hsl(var(--primary));
        background: hsl(var(--secondary));
        transform: translateY(-2px);
      }
      .cp-composer {
        display: flex;
        gap: 9px;
        align-items: center;
        border: 1px solid hsl(var(--input));
        border-radius: 14px;
        padding: 6px 7px 6px 13px;
        background: hsl(var(--background) / 0.63);
      }
      .cp-composer input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        color: hsl(var(--foreground));
        background: transparent;
        font-size: 0.82rem;
      }
      .cp-composer input::placeholder { color: hsl(var(--muted-foreground)); }
      .cp-send {
        flex: none;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        color: hsl(var(--primary-foreground));
        background: hsl(var(--primary));
        font-size: 1.1rem;
        transition: transform 180ms ease, background-color 180ms ease;
      }
      .cp-send:hover { background: hsl(176 35% 24%); transform: translateY(-1px); }
      .cp-disclaimer {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 15px 1px 0;
        color: hsl(var(--muted-foreground));
        font-size: 0.68rem;
        line-height: 1.45;
      }
      .cp-disclaimer-icon { flex: none; color: hsl(var(--primary)); }
      .cp-primary-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 12px;
        padding: 12px 15px;
        cursor: pointer;
        color: hsl(var(--primary-foreground));
        background: hsl(var(--primary));
        font-size: 0.79rem;
        font-weight: 700;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }
      .cp-primary-button:hover {
        box-shadow: 0 7px 17px hsl(var(--primary) / 0.18);
        transform: translateY(-2px);
      }
      .cp-primary-button:disabled { cursor: wait; opacity: 0.65; transform: none; }
      .cp-section { padding: 88px 0; }
      .cp-section-heading { align-items: end; gap: 28px; margin-bottom: 29px; }
      .cp-section-heading h2, .cp-finder h2 {
        color: hsl(var(--foreground));
        font-size: clamp(2rem, 4vw, 3.25rem);
        line-height: 1.02;
      }
      .cp-section-heading h2 { max-width: 560px; margin: 10px 0 0; }
      .cp-section-heading > p {
        max-width: 300px;
        margin: 0 0 3px;
        color: hsl(var(--muted-foreground));
        font-size: 0.86rem;
        line-height: 1.6;
      }
      .cp-safety {
        display: flex;
        align-items: center;
        gap: 16px;
        border: 1px solid hsl(23 86% 77% / 0.8);
        border-radius: 17px;
        padding: 17px 20px;
        color: hsl(var(--accent-foreground));
        background: hsl(var(--accent) / 0.33);
      }
      .cp-safety-icon { flex: none; font-size: 1.5rem; }
      .cp-safety strong { display: block; margin-bottom: 3px; font-size: 0.82rem; }
      .cp-safety span { display: block; font-size: 0.76rem; line-height: 1.5; }
      .cp-results {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(265px, 0.75fr);
        gap: 18px;
      }
      .cp-condition-list, .cp-clinicians { display: grid; gap: 12px; }
      .cp-condition {
        display: grid;
        grid-template-columns: 42px 1fr auto;
        gap: 15px;
        align-items: start;
        border: 1px solid hsl(var(--card-border));
        border-radius: 18px;
        padding: 20px;
        background: hsl(var(--card) / 0.72);
        transition: border-color 200ms ease, transform 200ms ease, box-shadow 200ms ease;
      }
      .cp-condition:hover {
        border-color: hsl(var(--primary) / 0.45);
        box-shadow: 0 2px 10px hsl(var(--foreground) / 0.07);
        transform: translateY(-2px);
      }
      .cp-condition-number {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        color: hsl(var(--primary));
        background: hsl(var(--secondary));
        font-family: var(--font-serif);
        font-size: 1.35rem;
      }
      .cp-condition h3 { margin: 1px 0 7px; font-size: 1.02rem; }
      .cp-condition p {
        margin: 0;
        color: hsl(var(--muted-foreground));
        font-size: 0.78rem;
        line-height: 1.6;
      }
      .cp-learn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        grid-column: 2;
        justify-self: start;
        border: 0;
        cursor: pointer;
        color: hsl(var(--primary));
        background: transparent;
        font-size: 0.73rem;
        font-weight: 700;
      }
      .cp-learn:hover { text-decoration: underline; }
      .cp-tag {
        display: inline-flex;
        align-items: center;
        border-radius: 99px;
        padding: 5px 9px;
        color: hsl(var(--primary));
        background: hsl(var(--secondary));
        font-size: 0.68rem;
        font-weight: 700;
      }
      .cp-summary-card {
        align-self: start;
        border-radius: 20px;
        padding: 23px;
        color: hsl(var(--primary-foreground));
        background: hsl(var(--primary));
        box-shadow: 0 6px 18px hsl(var(--foreground) / 0.1);
      }
      .cp-summary-card .cp-kicker { color: hsl(var(--accent)); }
      .cp-summary-card h3 {
        margin: 14px 0 22px;
        font-family: var(--font-serif);
        font-size: 1.8rem;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .cp-summary-stat {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid hsl(var(--primary-foreground) / 0.2);
        padding: 12px 0;
        color: hsl(var(--primary-foreground) / 0.8);
        font-size: 0.75rem;
      }
      .cp-summary-stat strong { color: hsl(var(--primary-foreground)); }
      .cp-finder {
        border-radius: 26px;
        padding: clamp(23px, 4vw, 40px);
        background: hsl(194 38% 88% / 0.7);
      }
      .cp-finder-grid {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 42px;
        align-items: center;
      }
      .cp-finder h2 { margin: 10px 0 12px; line-height: 1; }
      .cp-finder-copy {
        margin: 0;
        color: hsl(var(--muted-foreground));
        font-size: 0.84rem;
        line-height: 1.6;
      }
      .cp-zip-form {
        display: flex;
        gap: 9px;
        align-items: center;
        margin-top: 22px;
      }
      .cp-zip-input {
        width: 144px;
        border: 1px solid hsl(var(--input));
        border-radius: 12px;
        padding: 12px 14px;
        outline: 0;
        color: hsl(var(--foreground));
        background: hsl(var(--card) / 0.83);
        font-size: 0.84rem;
      }
      .cp-clinician {
        align-items: center;
        gap: 14px;
        border: 1px solid hsl(var(--card-border));
        border-radius: 15px;
        padding: 15px 17px;
        background: hsl(var(--card) / 0.79);
        animation: cp-fade 400ms both;
      }
      .cp-clinician h3 { margin: 0 0 4px; font-size: 0.86rem; }
      .cp-clinician p {
        margin: 0;
        color: hsl(var(--muted-foreground));
        font-size: 0.7rem;
      }
      .cp-clinician a {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: none;
        color: hsl(var(--primary));
        font-size: 0.72rem;
        font-weight: 700;
        text-decoration: none;
      }
      .cp-clinician a:hover { text-decoration: underline; }
      .cp-empty {
        border: 1px dashed hsl(var(--border));
        border-radius: 15px;
        padding: 25px;
        color: hsl(var(--muted-foreground));
        background: hsl(var(--card) / 0.43);
        font-size: 0.78rem;
        line-height: 1.55;
      }
      .cp-footer {
        align-items: center;
        gap: 22px;
        border-top: 1px solid hsl(var(--border));
        padding: 27px 0 34px;
        color: hsl(var(--muted-foreground));
        font-size: 0.7rem;
        line-height: 1.55;
      }
      .cp-footer p { max-width: 540px; margin: 0; }
      .cp-footer strong { color: hsl(var(--foreground)); }
      .cp-contact-link-footer { flex-shrink: 0; margin-left: auto; }
      .cp-error { color: hsl(var(--destructive)); font-size: 0.69rem; }
      @keyframes cp-rise {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes cp-fade {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 820px) {
        .cp-hero, .cp-finder-grid { grid-template-columns: 1fr; }
        .cp-hero { padding-top: 42px; }
        .cp-results { grid-template-columns: 1fr; }
        .cp-summary-card { order: -1; }
      }
      @media (max-width: 540px) {
        .cp-nav, .cp-wrap { width: min(100% - 28px, 1180px); }
        .cp-nav { padding-top: 17px; }
        .cp-nav-meta span { display: none; }
        .cp-nav-actions { gap: 10px; }
        .cp-contact-link { padding: 8px 10px; }
        .cp-hero { gap: 34px; padding: 36px 0 64px; }
        .cp-hero h1 { font-size: clamp(2.75rem, 16vw, 4.4rem); }
        .cp-intake-card { padding: 17px; border-radius: 19px; }
        .cp-section { padding: 63px 0; }
        .cp-section-heading { display: block; }
        .cp-section-heading > p { margin-top: 14px; }
        .cp-condition { grid-template-columns: 35px 1fr; gap: 11px; padding: 15px; }
        .cp-condition-number { width: 35px; height: 35px; border-radius: 10px; font-size: 1.08rem; }
        .cp-condition .cp-tag { grid-column: 2; justify-self: start; }
        .cp-zip-form { align-items: stretch; }
        .cp-zip-input { width: 42%; }
        .cp-primary-button { flex: 1; }
        .cp-footer { display: block; }
        .cp-footer p + p { margin-top: 13px; }
        .cp-contact-link-footer { display: inline-flex; margin-top: 18px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const contactUrl = "https://tally.so/r/ja4LWJ";
        const prompts = [
          ["Headaches or pressure", "Fatigue or low energy", "A lab result"],
          ["Started recently", "Comes and goes", "Has been getting worse"],
          ["I have a question for my clinician", "I want to understand the result"]
        ];
        const conditions = [
          {
            id: "thyroid",
            name: "Thyroid imbalance",
            tag: "Worth asking about",
            body: "Changes in energy, temperature comfort, heart rate, weight, or mood can sometimes overlap with thyroid conditions. A clinician may consider a TSH test alongside your story.",
            why: "A single lab value is rarely the whole picture. Timing, medications, and related thyroid hormones can change how a result is understood."
          },
          {
            id: "iron",
            name: "Iron deficiency",
            tag: "Common overlap",
            body: "Fatigue, headaches, shortness of breath with activity, or restless legs can overlap with low iron. Your clinician may look at ferritin and a complete blood count together.",
            why: "Iron needs and causes vary. Heavy periods, diet, absorption, and other sources of blood loss are useful context to bring to an appointment."
          },
          {
            id: "migraine",
            name: "Migraine pattern",
            tag: "Pattern to track",
            body: "Some headaches come with light sensitivity, nausea, or a need for quiet. Tracking when they happen and what comes before them can help a clinician recognize a pattern.",
            why: "Migraine is identified from the pattern of symptoms, not from one scan or lab result. A short symptom diary can be especially helpful."
          }
        ];
        const clinicians = [
          { name: "Harborview Family Medicine", detail: "Primary care · 2.4 miles away", website: "https://www.zocdoc.com" },
          { name: "Juniper Health Partners", detail: "Internal medicine · 4.1 miles away", website: "https://www.healthgrades.com" },
          { name: "Northline Community Clinic", detail: "Primary care · 5.8 miles away", website: "https://www.fqhc.org" }
        ];
        const state = {
          step: 0,
          messages: [{ role: "assistant", text: "Let’s make this easier to explain. What symptom or finding has been on your mind?" }],
          answers: [],
          showResults: false,
          selectedCondition: null,
          zip: "",
          finder: "idle"
        };

        const icons = {
          heart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 8.6c0 5.4-8.8 10.4-8.8 10.4S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.3Z"/><path d="M7.5 10.5h2l1-2.5 2 5 1.2-2.5h2.8"/></svg>',
          external: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>',
          info: '<svg class="cp-disclaimer-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>',
          send: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
          arrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
          chevron: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
          close: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 6-12 12"/><path d="m6 6 12 12"/></svg>',
          search: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
          pin: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
          note: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>',
          alert: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.2 2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>'
        };
        const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        }[char]));
        const contactLink = (extraClass = "") =>
          `<a class="cp-contact-link ${extraClass}" href="${contactUrl}" target="_blank" rel="noreferrer">Contact Us ${icons.external}</a>`;

        function render() {
          const currentPrompts = prompts[Math.min(state.step, prompts.length - 1)];
          const messages = state.messages.slice(-5).map((message) =>
            `<div class="cp-bubble ${message.role === "user" ? "user" : ""}">
              <small>${message.role === "user" ? "You" : "CarePath guide"}</small>
              ${escapeHtml(message.text)}
            </div>`
          ).join("");
          const options = currentPrompts.map((prompt) =>
            `<button class="cp-option" type="button" data-prompt="${escapeHtml(prompt)}">${escapeHtml(prompt)}</button>`
          ).join("");
          const results = state.showResults ? `
            <section class="cp-wrap cp-section" id="possible" aria-labelledby="possible-title">
              <div class="cp-section-heading">
                <div><p class="cp-kicker">A place to begin</p><h2 id="possible-title" class="cp-serif">Possible paths to explore with a clinician</h2></div>
                <p>These are educational patterns that may overlap with what you shared. They are not diagnoses or a ranking of likelihood.</p>
              </div>
              <div class="cp-results">
                <div class="cp-condition-list">
                  ${conditions.map((condition, index) => `
                    <article class="cp-condition">
                      <span class="cp-condition-number">${String(index + 1).padStart(2, "0")}</span>
                      <div>
                        <h3>${condition.name}</h3>
                        <p>${condition.body}</p>
                        ${state.selectedCondition === condition.id ? `<p style="margin-top:10px;color:hsl(var(--primary))"><strong>Why this may come up:</strong> ${condition.why}</p>` : ""}
                      </div>
                      <div class="cp-tag">${condition.tag}</div>
                      <button class="cp-learn" type="button" data-learn="${condition.id}">${state.selectedCondition === condition.id ? "Close" : "Learn why"} ${state.selectedCondition === condition.id ? icons.close : icons.chevron}</button>
                    </article>
                  `).join("")}
                </div>
                <aside class="cp-summary-card">
                  <p class="cp-kicker">Your note, gathered</p>
                  <h3>A gentler way to walk in prepared.</h3>
                  <div class="cp-summary-stat"><span>Details captured</span><strong>${state.answers.length}</strong></div>
                  <div class="cp-summary-stat"><span>Conversation prompts</span><strong>04</strong></div>
                  <div class="cp-summary-stat"><span>Medical certainty</span><strong>None</strong></div>
                </aside>
              </div>
            </section>` : "";
          let finderContent = "";
          if (state.finder === "idle") {
            finderContent = `<div class="cp-empty">${icons.note}<br />Your results will appear here after you enter a ZIP code. CarePath does not book appointments or endorse a specific clinician.</div>`;
          } else if (state.finder === "loading") {
            finderContent = `<div class="cp-empty">Finding nearby starting points…</div>`;
          } else {
            finderContent = clinicians.map((clinician) => `
              <div class="cp-clinician">
                <div><h3>${clinician.name}</h3><p>${clinician.detail} · ${escapeHtml(state.zip)}</p></div>
                <a href="${clinician.website}" target="_blank" rel="noreferrer">Website ${icons.external}</a>
              </div>`).join("");
          }

          document.getElementById("app").innerHTML = `
            <div class="cp-shell">
              <header class="cp-nav">
                <a class="cp-brand" href="#" aria-label="CarePath home"><span class="cp-brand-mark">${icons.heart}</span>CarePath</a>
                <div class="cp-nav-actions"><div class="cp-nav-meta"><span class="cp-trust-dot"></span><span>Private by design · No account needed</span></div>${contactLink()}</div>
              </header>
              <main>
                <section class="cp-wrap cp-hero" aria-labelledby="hero-title">
                  <div>
                    <p class="cp-kicker">A clearer next conversation</p>
                    <h1 id="hero-title" class="cp-serif">Make sense of the <em>in-between.</em></h1>
                    <p class="cp-hero-copy">CarePath helps you organize symptoms and lab findings into a thoughtful starting point for a conversation with a licensed clinician.</p>
                    <div class="cp-proof-row"><span>◉</span><span>Plain-language education, not a diagnosis</span><span class="cp-proof-line"></span><span>About 3 minutes</span></div>
                  </div>
                  <div class="cp-intake-card">
                    <div class="cp-card-top"><div class="cp-card-title"><span class="cp-card-title-icon">${icons.heart}</span><span>Your private note</span></div><span class="cp-step-count">Step ${Math.min(state.step + 1, 3)} of 3</span></div>
                    <div class="cp-progress"><span style="width:${Math.min((state.step + 1) * 33, 100)}%"></span></div>
                    <div class="cp-chat" aria-live="polite">${messages}<div class="cp-options" aria-label="Suggested answers">${options}</div></div>
                    <form class="cp-composer" id="note-form"><input id="note-input" placeholder="Or write it in your own words…" aria-label="Describe a symptom or finding" /><button class="cp-send" type="submit" aria-label="Add note">${icons.send}</button></form>
                    <div class="cp-disclaimer">${icons.info}<span>CarePath is educational and cannot diagnose, treat, or replace medical advice.</span></div>
                    ${state.answers.length >= 2 ? `<button class="cp-primary-button" id="review-button" type="button" style="width:100%;margin-top:17px">Review possible paths ${icons.arrow}</button>` : ""}
                  </div>
                </section>
                <section class="cp-wrap cp-safety"><span class="cp-safety-icon">${icons.alert}</span><div><strong>If something feels urgent, pause here.</strong><span>For chest pain, severe trouble breathing, sudden weakness, confusion, or thoughts of self-harm, call emergency services or go to the nearest emergency department now.</span></div></section>
                ${results}
                <section class="cp-wrap cp-section" id="find-care" aria-labelledby="finder-title">
                  <div class="cp-finder"><div class="cp-finder-grid"><div><p class="cp-kicker">The next small step</p><h2 id="finder-title" class="cp-serif">Find someone to talk it through with.</h2><p class="cp-finder-copy">Enter a ZIP code to see a few nearby starting points. Confirm availability, insurance, and services directly with each clinic.</p><form class="cp-zip-form" id="zip-form"><input class="cp-zip-input" id="zip-input" inputmode="numeric" maxlength="5" placeholder="ZIP code" aria-label="ZIP code" value="${escapeHtml(state.zip)}" /><button class="cp-primary-button" type="submit" ${state.finder === "loading" ? "disabled" : ""}>${state.finder === "loading" ? "Looking nearby" : `${icons.search} Find care`}</button></form><p id="zip-error" class="cp-error" hidden>Enter a five-digit ZIP code.</p></div><div class="cp-clinicians">${finderContent}</div></div></div>
                </section>
                <footer class="cp-wrap cp-footer"><p><strong>CarePath</strong> is a calm place to gather your thoughts before care. Your entries stay in this browser for this session and are not sent to a server.</p><p>ⓘ Always share the full picture with a licensed clinician.</p>${contactLink("cp-contact-link-footer")}</footer>
              </main>
            </div>`;
          bindEvents();
        }

        function addAnswer(value) {
          state.answers.push(value);
          state.messages.push({ role: "user", text: value });
          if (state.step < 2) {
            const next = state.step === 0
              ? "Thank you. When did you first notice it, and how has it been behaving?"
              : "That context helps. What would you most like to understand before speaking with a clinician?";
            state.step += 1;
            render();
            window.setTimeout(() => { state.messages.push({ role: "assistant", text: next }); render(); }, 420);
          } else {
            render();
            window.setTimeout(() => { state.messages.push({ role: "assistant", text: "That gives us a useful starting point. You can review a few educational possibilities below." }); render(); }, 420);
          }
        }

        function bindEvents() {
          document.querySelectorAll("[data-prompt]").forEach((button) => {
            button.addEventListener("click", () => addAnswer(button.dataset.prompt));
          });
          document.querySelectorAll("[data-learn]").forEach((button) => {
            button.addEventListener("click", () => {
              state.selectedCondition = state.selectedCondition === button.dataset.learn ? null : button.dataset.learn;
              render();
            });
          });
          document.getElementById("note-form").addEventListener("submit", (event) => {
            event.preventDefault();
            const input = document.getElementById("note-input");
            const value = input.value.trim();
            if (value) addAnswer(value);
          });
          const review = document.getElementById("review-button");
          if (review) review.addEventListener("click", () => {
            state.showResults = true;
            render();
            document.getElementById("possible").scrollIntoView({ behavior: "smooth", block: "start" });
          });
          document.getElementById("zip-form").addEventListener("submit", (event) => {
            event.preventDefault();
            const input = document.getElementById("zip-input");
            state.zip = input.value.replace(/\D/g, "").slice(0, 5);
            const error = document.getElementById("zip-error");
            if (state.zip.length < 5) { error.hidden = false; return; }
            state.finder = "loading";
            render();
            window.setTimeout(() => { state.finder = "done"; render(); }, 650);
          });
          const zipInput = document.getElementById("zip-input");
          zipInput.addEventListener("input", () => { zipInput.value = zipInput.value.replace(/\D/g, "").slice(0, 5); });
        }
        render();
      })();
    </script>
  </body>
</html>
